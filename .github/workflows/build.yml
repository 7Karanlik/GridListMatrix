name: Build GridListMatrix

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 12.22.12
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Power BI Visual Tools 2.5.0
        run: npm install -g powerbi-visuals-tools@2.5.0

      - name: Build PBIVIZ
        run: pbiviz package

      - name: Upload PBIVIZ
        uses: actions/upload-artifact@v4
        with:
          name: GridListMatrix-pbiviz
          path: dist/*.pbiviz
