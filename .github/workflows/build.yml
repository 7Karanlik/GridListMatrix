name: Build GridListMatrix

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build PBIVIZ
        run: npx pbiviz package

      - name: Upload PBIVIZ
        uses: actions/upload-artifact@v4
        with:
          name: GridListMatrix-pbiviz
          path: dist/*.pbiviz
